name: Build (confirmation)

# Full Tauri build for the Issue駆動開発フロー's build confirmation step
# (docs/仕様/Issue駆動開発フロー.md §3). No release/tag is created here --
# just an installer artifact for manual download and verification.
#
# Dispatched directly against feature/<Issue番号> (no separate build/<name>
# mirror branch -- removed 2026-08-22 in favor of just building the feature
# branch itself, accepting the extra build frequency). Pushes made with the
# automatic GITHUB_TOKEN (as the self-hosted build-confirm job does) do NOT
# trigger other workflow runs -- a documented GitHub Actions limitation to
# prevent infinite trigger loops -- so workflow_dispatch, called explicitly
# via the REST API, is required rather than a push trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (unsigned, no release)
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
