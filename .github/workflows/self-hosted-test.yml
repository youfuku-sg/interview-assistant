name: Self-hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/self-hosted-runner-verify

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show runner info
        shell: powershell
        run: |
          Write-Host "Hostname: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          whoami

      - name: Check for claude CLI
        shell: powershell
        run: |
          if (Get-Command claude -ErrorAction SilentlyContinue) {
            claude --version
          } else {
            Write-Host "claude CLI not found in PATH"
          }

      - name: Check for codex CLI
        shell: powershell
        run: |
          if (Get-Command codex -ErrorAction SilentlyContinue) {
            codex --version
          } else {
            Write-Host "codex CLI not found in PATH"
          }

      - name: Check LM Studio (localhost:1234)
        shell: powershell
        run: |
          try {
            $models = Invoke-RestMethod -Uri "http://localhost:1234/v1/models" -Method Get -TimeoutSec 10
            Write-Host "LM Studio reachable. Models:"
            $models.data | ForEach-Object { Write-Host " - $($_.id)" }

            if ($models.data.Count -gt 0) {
              $modelId = $models.data[0].id
              Write-Host "Calling chat/completions with model '$modelId'..."
              $body = @{
                model = $modelId
                messages = @(@{ role = "user"; content = "Reply with exactly the word: ok" })
                stream = $false
              } | ConvertTo-Json -Depth 5

              $resp = Invoke-RestMethod -Uri "http://localhost:1234/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 60
              Write-Host "Response: $($resp.choices[0].message.content)"
            } else {
              Write-Host "No models loaded in LM Studio."
            }
          } catch {
            Write-Host "LM Studio not reachable or call failed: $_"
          }

      - name: Check openspec and openwiki are present in the checked-out workspace
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          $paths = @(
            "openwiki\quickstart.md",
            "openspec\config.yaml",
            "openspec\specs"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "FOUND: $p"
            } else {
              Write-Host "MISSING: $p"
            }
          }

          Write-Host "openspec/specs capabilities:"
          Get-ChildItem "openspec\specs" -Directory | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Ask LM Studio a question grounded in openwiki content
        shell: powershell
        run: |
          try {
            $quickstart = Get-Content -Path "openwiki\quickstart.md" -Raw

            $models = Invoke-RestMethod -Uri "http://localhost:1234/v1/models" -Method Get -TimeoutSec 10
            if ($models.data.Count -eq 0) {
              Write-Host "No models loaded in LM Studio."
              exit 0
            }
            $modelId = $models.data[0].id
            Write-Host "Using model '$modelId'"

            $prompt = "Here is a project document:`n---`n$quickstart`n---`nBased only on the document above, answer in one short sentence: what tech stack does this project use?"

            $body = @{
              model = $modelId
              messages = @(@{ role = "user"; content = $prompt })
              stream = $false
            } | ConvertTo-Json -Depth 5

            $resp = Invoke-RestMethod -Uri "http://localhost:1234/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 120
            Write-Host "Model answer: $($resp.choices[0].message.content)"
          } catch {
            Write-Host "Call failed: $_"
          }
