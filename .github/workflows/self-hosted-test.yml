name: Self-hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/self-hosted-runner-verify

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show runner info
        shell: powershell
        run: |
          Write-Host "Hostname: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          whoami

      - name: Install/verify Claude Code CLI via npm (existing native install isn't on the service's PATH)
        shell: powershell
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Trust this workspace in ~/.claude.json (so permissions.allow is honored)
        shell: powershell
        run: |
          $claudeJsonPath = "$env:USERPROFILE\.claude.json"
          $backupPath = "$env:USERPROFILE\.claude.json.bak"

          if (-not (Test-Path $claudeJsonPath)) {
            Write-Host "$claudeJsonPath does not exist; skipping (claude will create it on first run)"
            exit 0
          }

          Copy-Item $claudeJsonPath $backupPath -Force
          Write-Host "Backed up to $backupPath"

          $json = Get-Content $claudeJsonPath -Raw | ConvertFrom-Json
          $topLevelKeysBefore = @($json.PSObject.Properties.Name)
          Write-Host "Top-level keys before: $($topLevelKeysBefore -join ', ')"

          $projectPath = ($env:GITHUB_WORKSPACE -replace '\\', '/')
          Write-Host "Trusting project path: $projectPath"

          if (-not $json.projects) {
            $json | Add-Member -MemberType NoteProperty -Name projects -Value ([PSCustomObject]@{}) -Force
          }

          $projectKeys = @($json.projects.PSObject.Properties.Name)
          Write-Host "Existing trusted project count before: $($projectKeys.Count)"

          if (-not ($projectKeys -contains $projectPath)) {
            $json.projects | Add-Member -MemberType NoteProperty -Name $projectPath -Value ([PSCustomObject]@{}) -Force
          }

          $json.projects.$projectPath | Add-Member -MemberType NoteProperty -Name hasTrustDialogAccepted -Value $true -Force

          $json | ConvertTo-Json -Depth 100 | Set-Content -Path $claudeJsonPath -Encoding utf8

          # Verify: re-read, confirm valid JSON, confirm no top-level keys were lost, confirm the flag is set
          $verify = Get-Content $claudeJsonPath -Raw | ConvertFrom-Json
          $topLevelKeysAfter = @($verify.PSObject.Properties.Name)
          Write-Host "Top-level keys after: $($topLevelKeysAfter -join ', ')"

          $missing = $topLevelKeysBefore | Where-Object { $topLevelKeysAfter -notcontains $_ }
          if ($missing) {
            Write-Host "WARNING: top-level keys were lost during rewrite: $($missing -join ', '). Restoring backup."
            Copy-Item $backupPath $claudeJsonPath -Force
            exit 1
          }

          $flag = $verify.projects.$projectPath.hasTrustDialogAccepted
          Write-Host "hasTrustDialogAccepted for this workspace is now: $flag"
          if ($flag -ne $true) {
            Write-Host "WARNING: flag was not set correctly. Restoring backup."
            Copy-Item $backupPath $claudeJsonPath -Force
            exit 1
          }

      - name: Run Claude Code headlessly (using whatever local auth already exists)
        shell: powershell
        timeout-minutes: 10
        continue-on-error: true
        run: |
          claude -p "Reply with exactly the word: ok"

      - name: Install/verify Codex CLI via npm (existing native install isn't on the service's PATH)
        shell: powershell
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Run Codex headlessly (using whatever local auth already exists)
        shell: powershell
        timeout-minutes: 10
        continue-on-error: true
        run: |
          codex exec "Reply with exactly the word: ok"

      - name: Check LM Studio (localhost:1234)
        shell: powershell
        run: |
          try {
            $models = Invoke-RestMethod -Uri "http://localhost:1234/v1/models" -Method Get -TimeoutSec 10
            Write-Host "LM Studio reachable. Models:"
            $models.data | ForEach-Object { Write-Host " - $($_.id)" }

            if ($models.data.Count -gt 0) {
              $modelId = $models.data[0].id
              Write-Host "Calling chat/completions with model '$modelId'..."
              $body = @{
                model = $modelId
                messages = @(@{ role = "user"; content = "Reply with exactly the word: ok" })
                stream = $false
              } | ConvertTo-Json -Depth 5

              $resp = Invoke-RestMethod -Uri "http://localhost:1234/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 60
              Write-Host "Response: $($resp.choices[0].message.content)"
            } else {
              Write-Host "No models loaded in LM Studio."
            }
          } catch {
            Write-Host "LM Studio not reachable or call failed: $_"
          }

      - name: Raw API call to LM Studio with google/gemma-4-12b specifically
        shell: powershell
        timeout-minutes: 5
        run: |
          try {
            $body = @{
              model = "google/gemma-4-12b"
              messages = @(@{ role = "user"; content = "Reply with exactly the word: ok" })
              stream = $false
            } | ConvertTo-Json -Depth 5

            $resp = Invoke-RestMethod -Uri "http://localhost:1234/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 120
            Write-Host "Response: $($resp.choices[0].message.content)"
          } catch {
            Write-Host "Call failed: $_"
          }

      - name: Check openspec and openwiki are present in the checked-out workspace
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          $paths = @(
            "openwiki\quickstart.md",
            "openspec\config.yaml",
            "openspec\specs"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "FOUND: $p"
            } else {
              Write-Host "MISSING: $p"
            }
          }

          Write-Host "openspec/specs capabilities:"
          Get-ChildItem "openspec\specs" -Directory | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Ask LM Studio a question grounded in openwiki content
        shell: powershell
        run: |
          try {
            $quickstart = Get-Content -Path "openwiki\quickstart.md" -Raw

            $models = Invoke-RestMethod -Uri "http://localhost:1234/v1/models" -Method Get -TimeoutSec 10
            if ($models.data.Count -eq 0) {
              Write-Host "No models loaded in LM Studio."
              exit 0
            }
            $modelId = $models.data[0].id
            Write-Host "Using model '$modelId'"

            $prompt = "Here is a project document:`n---`n$quickstart`n---`nBased only on the document above, answer in one short sentence: what tech stack does this project use?"

            $body = @{
              model = $modelId
              messages = @(@{ role = "user"; content = $prompt })
              stream = $false
            } | ConvertTo-Json -Depth 5

            $resp = Invoke-RestMethod -Uri "http://localhost:1234/v1/chat/completions" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 120
            Write-Host "Model answer: $($resp.choices[0].message.content)"
          } catch {
            Write-Host "Call failed: $_"
          }

      - name: Check for Node/npm
        shell: powershell
        run: |
          if (Get-Command node -ErrorAction SilentlyContinue) {
            node --version
          } else {
            Write-Host "node not found in PATH"
          }
          if (Get-Command npm -ErrorAction SilentlyContinue) {
            npm --version
          } else {
            Write-Host "npm not found in PATH"
          }

      - name: Install OpenCode
        shell: powershell
        run: |
          npm install -g opencode-ai
          opencode --version

      - name: Configure OpenCode to use LM Studio
        shell: powershell
        run: |
          $configDir = "$env:USERPROFILE\.config\opencode"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          $config = @{
            '$schema' = "https://opencode.ai/config.json"
            provider = @{
              lmstudio = @{
                npm = "@ai-sdk/openai-compatible"
                name = "lmstudio"
                options = @{
                  baseURL = "http://127.0.0.1:1234/v1"
                  apiKey = "lmstudio"
                }
                models = @{
                  "qwen3.6-35b-a3b-mtp" = @{ name = "qwen3.6-35b-a3b-mtp" }
                }
              }
            }
          } | ConvertTo-Json -Depth 10

          Set-Content -Path "$configDir\opencode.json" -Value $config
          Get-Content "$configDir\opencode.json"

      - name: Run OpenCode headlessly against LM Studio
        # Paused pending investigation (two failures so far: 55min hang with no
        # output, then "Engine protocol predict request failed: fetch failed").
        # Skipping for now to iterate faster on the Aider path.
        if: false
        shell: powershell
        timeout-minutes: 15
        continue-on-error: true
        run: |
          opencode run --model lmstudio/qwen3.6-35b-a3b-mtp "What tech stack does this project use? Answer in one short sentence, based on AGENTS.md."

      - name: Check for Python/pip
        shell: powershell
        run: |
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            Write-Host "python not found in PATH"
          }
          if (Get-Command pip -ErrorAction SilentlyContinue) {
            pip --version
          } else {
            Write-Host "pip not found in PATH"
          }

      - name: Install Python 3.12 (aider does not support 3.13 yet)
        shell: powershell
        run: |
          winget install --id Python.Python.3.12 -e --silent --accept-package-agreements --accept-source-agreements
          py -3.12 --version

      - name: Install Aider on Python 3.12
        shell: powershell
        run: |
          py -3.12 -m pip install --upgrade pip setuptools wheel
          py -3.12 -m pip install aider-chat
          py -3.12 -m aider --version

      - name: Run Aider headlessly against LM Studio (qwen3.6-35b-a3b-mtp)
        # Re-enabled: GPU VRAM was exhausted, now freed up. Retrying.
        shell: powershell
        timeout-minutes: 10
        continue-on-error: true
        env:
          LM_STUDIO_API_KEY: dummy-api-key
          LM_STUDIO_API_BASE: http://localhost:1234/v1
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001
          py -3.12 -m aider --model lm_studio/qwen3.6-35b-a3b-mtp --message "What tech stack does this project use? Answer in one short sentence, based on AGENTS.md." --yes --no-auto-commits --no-stream

      - name: Run Aider headlessly against LM Studio (google/gemma-4-12b)
        shell: powershell
        timeout-minutes: 10
        env:
          LM_STUDIO_API_KEY: dummy-api-key
          LM_STUDIO_API_BASE: http://localhost:1234/v1
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001
          py -3.12 -m aider --model lm_studio/google/gemma-4-12b --message "What tech stack does this project use? Answer in one short sentence, based on AGENTS.md." --yes --no-auto-commits --no-stream
