name: Issue → OpenSpec Proposal

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    # Deterministic, no AI involved: guarantees a branch exists for this
    # issue immediately, even if the proposal step below fails later.
    runs-on: ubuntu-latest
    outputs:
      branch: feature/${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create and push feature/<issue number>
        run: |
          git checkout -b "feature/${{ github.event.issue.number }}"
          git push origin "feature/${{ github.event.issue.number }}"

  propose:
    needs: create-branch
    # Runs on the self-hosted runner so Claude Code can use the machine's
    # existing local login (no ANTHROPIC_API_KEY secret needed).
    runs-on: [self-hosted, Windows, X64]
    outputs:
      proposed: ${{ steps.push.outputs.proposed }}
      change_name: ${{ steps.push.outputs.change_name }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - name: Create OpenSpec proposal with Claude Code
        shell: powershell
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Issue title/body are untrusted input AND may contain non-ASCII
          # (e.g. Japanese) text, which gets mangled when round-tripped
          # through env vars on this Windows runner's console codepage.
          # Instead, point Claude at $env:GITHUB_EVENT_PATH, the JSON file
          # GitHub Actions always provides -- correct UTF-8 on disk,
          # unaffected by console encoding.
          $promptPath = "$env:RUNNER_TEMP\claude-propose-prompt.txt"
          $statusFilePath = "$env:RUNNER_TEMP\claude-propose-status.txt"

          @"
          A new GitHub Issue (#$env:ISSUE_NUMBER) was just opened. Read its
          title and body from the "issue" object in the GitHub event payload
          JSON file at: $env:GITHUB_EVENT_PATH
          (read the file directly; do not rely on any shell/env copy of its
          text, which may be mis-encoded on this Windows runner).

          You are already checked out on the feature branch created for this
          issue (``feature/$env:ISSUE_NUMBER``). Follow this repository's
          documented Issue駆動開発フロー (docs/仕様/Issue駆動開発フロー.md),
          steps 4.2〜4.3, to turn this rough request into an OpenSpec
          proposal. Do the following, in order:

          1. Read openwiki/quickstart.md and any linked OpenWiki pages
             relevant to this request to ground it in the current
             implementation, architecture, and constraints.

          2. Derive a short kebab-case description of the request from the
             issue title/body (e.g. "improve-stt-error-handling").

          3. Create the OpenSpec change using the openspec-propose skill /
             process:
             ``openspec new change "issue-$env:ISSUE_NUMBER-<short-description>" --goal "Issue #$env:ISSUE_NUMBER"``
             then generate proposal.md, design.md, tasks.md, and any
             specs/<capability>/spec.md deltas required by the schema. Follow
             the openspec-propose skill's guidance for what each artifact
             should contain. Do not implement any code changes at this stage
             -- only the OpenSpec proposal artifacts.

          4. Commit the new openspec/changes/<name>/ directory on the current
             branch, with a commit message referencing the issue number. Do
             not push -- that is handled separately.

          5. Write a single line to the file at $statusFilePath`: either
             "OK: <the exact OpenSpec change name you used>" on success, or
             "SKIP: <reason>" if the request is too vague to turn into a
             concrete proposal (in which case do not create any OpenSpec
             change or commit).
          "@ | Set-Content -Path $promptPath -Encoding utf8

          Get-Content -Raw $promptPath | claude -p --dangerously-skip-permissions

          if (-not (Test-Path $statusFilePath)) {
            Write-Host "Claude did not write a status file."
            exit 1
          }
          Get-Content $statusFilePath

      - name: Push proposal commit (if any)
        id: push
        shell: powershell
        run: |
          $statusFilePath = "$env:RUNNER_TEMP\claude-propose-status.txt"
          $status = (Get-Content $statusFilePath -Raw).Trim()

          if ($status.StartsWith("SKIP:")) {
            Write-Host "Skipped: $status"
            echo "proposed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changeName = $status -replace '^OK:\s*', ''
          Write-Host "Change name: $changeName"

          git push origin "HEAD:refs/heads/${{ needs.create-branch.outputs.branch }}"
          echo "proposed=true" >> $env:GITHUB_OUTPUT
          echo "change_name=$changeName" >> $env:GITHUB_OUTPUT

  ai-review:
    needs: [create-branch, propose]
    if: needs.propose.outputs.proposed == 'true'
    # Step 4.4 of the Issue駆動開発フロー: have every available AI (currently
    # Claude Code and Codex) discuss the proposal and loop -- present, argue,
    # revise, re-present -- until both agree, up to a bounded number of
    # rounds (§7 未決事項: no cap was decided yet, so this uses a
    # conservative default of 3 pending a real decision).
    runs-on: [self-hosted, Windows, X64]
    outputs:
      consensus: ${{ steps.loop.outputs.consensus }}
      rounds: ${{ steps.loop.outputs.rounds }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - name: Claude/Codex review loop
        id: loop
        shell: powershell
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHANGE_NAME: ${{ needs.propose.outputs.change_name }}
        run: |
          $maxRounds = 3
          $changeDir = "openspec/changes/$env:CHANGE_NAME"
          $reviewDir = "$env:RUNNER_TEMP\ai-review"
          New-Item -ItemType Directory -Force -Path $reviewDir | Out-Null

          $lastCodexNote = ""
          $consensus = $false
          $roundsUsed = 0

          for ($round = 1; $round -le $maxRounds; $round++) {
            $roundsUsed = $round
            Write-Host "=== AI review round $round ==="

            # --- Claude's turn ---
            $claudeContext = if ($lastCodexNote) { "Codex's feedback from the previous round:`n$lastCodexNote`n" } else { "This is the first round; no prior feedback yet." }
            @"
          You are one of two AI reviewers (the other is Codex) discussing the
          OpenSpec proposal at $changeDir for Issue #$env:ISSUE_NUMBER before
          implementation begins.

          $claudeContext

          Re-read the current proposal.md, design.md, tasks.md, and any
          specs/*/spec.md under $changeDir yourself. Cross-reference
          openwiki/ and openspec/specs/ for the current implementation. If
          you find real gaps, inconsistencies, or issues, edit the proposal
          files directly to fix them. If you have nothing to change, do not
          edit anything.

          End your response with exactly one line, verbatim:
          "VERDICT: AGREE" if the proposal as it now stands is ready to move
          to human review, or "VERDICT: REQUEST_CHANGES" (with your
          reasoning above it) if you believe further changes are still
          needed.
          "@ | Set-Content -Path "$reviewDir\claude-r$round.txt" -Encoding utf8

            $claudeOutput = (Get-Content -Raw "$reviewDir\claude-r$round.txt" | claude -p --dangerously-skip-permissions | Out-String)
            Set-Content -Path "$reviewDir\claude-r$round-output.md" -Value $claudeOutput -Encoding utf8
            Write-Host $claudeOutput
            $claudeVerdict = if ($claudeOutput -match "VERDICT:\s*AGREE") { "AGREE" } else { "REQUEST_CHANGES" }

            $claudeChanged = [bool](git status --porcelain -- $changeDir)
            if ($claudeChanged) {
              git add -- $changeDir
              git commit -m "AI review round $round (Claude): revise proposal for issue #$env:ISSUE_NUMBER" | Out-Null
            }

            # --- Codex's turn ---
            @"
          You are one of two AI reviewers (the other is Claude Code)
          discussing the OpenSpec proposal at $changeDir for Issue
          #$env:ISSUE_NUMBER before implementation begins.

          Claude's feedback this round (it may have just edited the
          proposal files -- re-read their current state yourself, don't
          rely on this text alone):

          $claudeOutput

          Cross-reference openwiki/ and openspec/specs/ for the current
          implementation. If you find real gaps, inconsistencies, or
          issues, edit the proposal files directly to fix them. If you have
          nothing to change, do not edit anything.

          End your response with exactly one line, verbatim:
          "VERDICT: AGREE" if the proposal as it now stands is ready to move
          to human review, or "VERDICT: REQUEST_CHANGES" (with your
          reasoning above it) if you believe further changes are still
          needed.
          "@ | Set-Content -Path "$reviewDir\codex-r$round.txt" -Encoding utf8

            Get-Content -Raw "$reviewDir\codex-r$round.txt" | codex exec -s workspace-write -o "$reviewDir\codex-r$round-output.md" -
            $codexOutput = Get-Content -Raw "$reviewDir\codex-r$round-output.md"
            Write-Host $codexOutput
            $codexVerdict = if ($codexOutput -match "VERDICT:\s*AGREE") { "AGREE" } else { "REQUEST_CHANGES" }
            $lastCodexNote = $codexOutput

            $codexChanged = [bool](git status --porcelain -- $changeDir)
            if ($codexChanged) {
              git add -- $changeDir
              git commit -m "AI review round $round (Codex): revise proposal for issue #$env:ISSUE_NUMBER" | Out-Null
            }

            if ($claudeVerdict -eq "AGREE" -and $codexVerdict -eq "AGREE" -and -not $claudeChanged -and -not $codexChanged) {
              Write-Host "Consensus reached after round $round."
              $consensus = $true
              break
            }
          }

          git push origin "HEAD:refs/heads/${{ needs.create-branch.outputs.branch }}"

          echo "consensus=$($consensus.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "rounds=$roundsUsed" >> $env:GITHUB_OUTPUT

  comment:
    needs: [create-branch, propose, ai-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.create-branch.outputs.branch }}
          PROPOSED: ${{ needs.propose.outputs.proposed }}
          CONSENSUS: ${{ needs.ai-review.outputs.consensus }}
          ROUNDS: ${{ needs.ai-review.outputs.rounds }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const proposed = process.env.PROPOSED === 'true';
            const consensus = process.env.CONSENSUS === 'true';
            const rounds = process.env.ROUNDS;

            let body;
            if (!proposed) {
              body = `Branch \`${branch}\` was created, but a proposal could not be drafted automatically — it may need more detail. Check the workflow run logs for details.`;
            } else if (consensus) {
              body = `OpenSpec proposal on \`${branch}\` drafted and reviewed by Claude Code and Codex (consensus reached after ${rounds} round(s)).\n\nCompare: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...${branch}\n\nAwaiting human review — nothing has been implemented yet.`;
            } else {
              body = `OpenSpec proposal on \`${branch}\` drafted, but Claude Code and Codex did not reach consensus after ${rounds} round(s) of review.\n\nCompare: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...${branch}\n\nPlease review manually — the two AIs disagreed on something. Check the workflow run logs for each round's reasoning.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
