name: Issue → OpenSpec Proposal

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    # Deterministic, no AI involved: guarantees a branch exists for this
    # issue immediately, even if the proposal step below fails later.
    runs-on: ubuntu-latest
    outputs:
      branch: feature/${{ github.event.issue.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create and push feature/<issue number>
        run: |
          git checkout -b "feature/${{ github.event.issue.number }}"
          git push origin "feature/${{ github.event.issue.number }}"

  propose:
    needs: create-branch
    # Runs on the self-hosted runner so Claude Code can use the machine's
    # existing local login (no ANTHROPIC_API_KEY secret needed).
    runs-on: [self-hosted, Windows, X64]
    outputs:
      proposed: ${{ steps.push.outputs.proposed }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.create-branch.outputs.branch }}

      - name: Create OpenSpec proposal with Claude Code
        shell: powershell
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Issue title/body are untrusted input AND may contain non-ASCII
          # (e.g. Japanese) text, which gets mangled when round-tripped
          # through env vars on this Windows runner's console codepage.
          # Instead, point Claude at $env:GITHUB_EVENT_PATH, the JSON file
          # GitHub Actions always provides -- correct UTF-8 on disk,
          # unaffected by console encoding.
          $promptPath = "$env:RUNNER_TEMP\claude-propose-prompt.txt"
          $statusFilePath = "$env:RUNNER_TEMP\claude-propose-status.txt"

          @"
          A new GitHub Issue (#$env:ISSUE_NUMBER) was just opened. Read its
          title and body from the "issue" object in the GitHub event payload
          JSON file at: $env:GITHUB_EVENT_PATH
          (read the file directly; do not rely on any shell/env copy of its
          text, which may be mis-encoded on this Windows runner).

          You are already checked out on the feature branch created for this
          issue (``feature/$env:ISSUE_NUMBER``). Follow this repository's
          documented Issue駆動開発フロー (docs/仕様/Issue駆動開発フロー.md),
          steps 4.2〜4.3, to turn this rough request into an OpenSpec
          proposal. Do the following, in order:

          1. Read openwiki/quickstart.md and any linked OpenWiki pages
             relevant to this request to ground it in the current
             implementation, architecture, and constraints.

          2. Derive a short kebab-case description of the request from the
             issue title/body (e.g. "improve-stt-error-handling").

          3. Create the OpenSpec change using the openspec-propose skill /
             process:
             ``openspec new change "issue-$env:ISSUE_NUMBER-<short-description>" --goal "Issue #$env:ISSUE_NUMBER"``
             then generate proposal.md, design.md, tasks.md, and any
             specs/<capability>/spec.md deltas required by the schema. Follow
             the openspec-propose skill's guidance for what each artifact
             should contain. Do not implement any code changes at this stage
             -- only the OpenSpec proposal artifacts.

          4. Commit the new openspec/changes/<name>/ directory on the current
             branch, with a commit message referencing the issue number. Do
             not push -- that is handled separately.

          5. Write a single line to the file at $statusFilePath`: either "OK"
             on success, or "SKIP: <reason>" if the request is too vague to
             turn into a concrete proposal (in which case do not create any
             OpenSpec change or commit).
          "@ | Set-Content -Path $promptPath -Encoding utf8

          Get-Content -Raw $promptPath | claude -p --dangerously-skip-permissions

          if (-not (Test-Path $statusFilePath)) {
            Write-Host "Claude did not write a status file."
            exit 1
          }
          Get-Content $statusFilePath

      - name: Push proposal commit (if any)
        id: push
        shell: powershell
        run: |
          $statusFilePath = "$env:RUNNER_TEMP\claude-propose-status.txt"
          $status = (Get-Content $statusFilePath -Raw).Trim()

          if ($status.StartsWith("SKIP:")) {
            Write-Host "Skipped: $status"
            echo "proposed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git push origin "HEAD:refs/heads/${{ needs.create-branch.outputs.branch }}"
          echo "proposed=true" >> $env:GITHUB_OUTPUT

  comment:
    needs: [create-branch, propose]
    runs-on: ubuntu-latest
    steps:
      - name: Comment on the issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BRANCH: ${{ needs.create-branch.outputs.branch }}
          PROPOSED: ${{ needs.propose.outputs.proposed }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const proposed = process.env.PROPOSED === 'true';
            const body = proposed
              ? `Draft OpenSpec proposal created on \`${branch}\`.\n\nCompare: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...${branch}\n\nThis is a draft proposal awaiting review — nothing has been implemented yet.`
              : `Branch \`${branch}\` was created, but a proposal could not be drafted automatically — it may need more detail. Check the workflow run logs for details.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
